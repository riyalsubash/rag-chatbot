services:
  - type: web
    name: rag-chatbot
    env: python
    buildCommand: pip install -r requirements_minimal.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 300
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.13.0